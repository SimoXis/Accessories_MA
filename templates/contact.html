{% extends 'base.html' %}

{% block head_title %}Contact | {{ store_settings.store_name }}{% endblock %}

{% block content %}
<section class="section-shell">
    <div class="container contact-container">

        <span class="eyebrow">Nous sommes à votre écoute</span>

        <h1>Contact</h1>

        <p class="contact-intro">
            Une question sur un produit ou une commande ? Contactez-nous directement.
        </p>

        <form method="post" class="contact-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_name">Nom</label>
                <input
                    type="text"
                    id="id_name"
                    name="name"
                    placeholder="Votre nom"
                >
            </div>

            <div class="form-group">
                <label for="id_email">E-mail*</label>
                <input
                    type="email"
                    id="id_email"
                    name="email"
                    placeholder="Votre adresse e-mail"
                    required
                >
            </div>

            <div class="form-group">
                <label for="id_phone">Numéro de téléphone</label>
                <input
                    type="tel"
                    id="id_phone"
                    name="phone"
                    placeholder="Votre numéro de téléphone"
                >
            </div>

            <div class="form-group">
                <label for="id_comment">Commentaire</label>
                <textarea
                    id="id_comment"
                    name="comment"
                    rows="7"
                    placeholder="Écrivez votre message..."
                ></textarea>
            </div>

            <button type="submit" class="contact-submit">
                Envoyer
            </button>

        </form>
    </div>
</section>

<style>
.contact-container {
    max-width: 760px;
}

.contact-container h1 {
    font-size: clamp(2.8rem, 6vw, 4.5rem);
    line-height: 1;
    margin: 8px 0 16px;
}

.contact-intro {
    max-width: 620px;
    margin: 0 0 35px;
    color: var(--store-muted);
    line-height: 1.7;
}

.contact-form {
    width: 100%;
    padding: 32px;
    background: #fff;
    border: 1px solid var(--store-line);
    box-sizing: border-box;
}

.form-group {
    margin-bottom: 22px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: var(--store-text, #202820);
    font-size: .9rem;
    font-weight: 700;
}

.form-group input,
.form-group textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 13px 14px;
    border: 1px solid #d8d6cf;
    border-radius: 4px;
    background: #fff;
    color: #202820;
    font-family: inherit;
    font-size: .95rem;
    outline: none;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #a35f3b;
    box-shadow: 0 0 0 3px rgba(163, 95, 59, .10);
}

.form-group textarea {
    min-height: 150px;
    resize: vertical;
}

.contact-submit {
    width: 100%;
    padding: 14px 20px;
    border: 0;
    border-radius: 4px;
    background: #202820;
    color: #fff;
    font-family: inherit;
    font-size: .9rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    cursor: pointer;
    transition: .2s ease;
}

.contact-submit:hover {
    background: #a35f3b;
}

@media (max-width: 575px) {
    .contact-form {
        padding: 22px 18px;
    }

    .contact-container h1 {
        font-size: 3rem;
    }
}
</style>
{% endblock %}
